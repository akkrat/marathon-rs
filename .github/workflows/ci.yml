name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  # Proves the release build on every push, so that a broken one is found before anyone tags.
  musl-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TARGET: x86_64-unknown-linux-musl
      VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-musl-tools
        with:
          cache: 'true'
      - name: Static archive and extracted smoke
        run: python3 -I scripts/release/release.py build --target "$TARGET" --version "$VERSION" --output "dist/$TARGET"
      - name: Run the packaged binary without glibc
        run: python3 -I scripts/release/release.py prove-musl --archive "dist/$TARGET/marathon-$VERSION-$TARGET.zip" --version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ env.TARGET }}
          path: dist/${{ env.TARGET }}/
          if-no-files-found: error
          retention-days: 14
