name: TEMP x9 reader stress

on:
  push:
    branches: ['wp/x9-ssh-output']

permissions:
  contents: read

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        code: [base, d19]
        shard: [1, 2, 3, 4]
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prerequisites
        run: |
          brew install rsync sshpass
          rustup toolchain install
      - name: Use main's reader (baseline)
        if: matrix.code == 'base'
        run: git checkout 3f0c8ccb -- crates/marathon-apple/src/extensions/reader.rs crates/marathon-apple/tests/reader.rs
      - name: Build
        run: |
          cargo test -q -p marathon-cli --test differential_vendors --no-run
          cargo build -q -p fake-worker -p fake-adb
          cargo build -q -p marathon-cli --example differential_cli
      - name: Repeat the vendor differential under CPU load
        shell: bash
        run: |
          mkdir -p stress
          fails=0
          for i in $(seq 1 10); do
            yes > /dev/null & y1=$!
            yes > /dev/null & y2=$!
            if ! cargo test -q -p marathon-cli --test differential_vendors > "stress/run-$i.txt" 2>&1; then
              fails=$((fails+1))
            fi
            kill $y1 $y2 || true
            wait $y1 $y2 2>/dev/null || true
            echo "== iteration $i"
            grep -oE "vendor differential failed.{0,300}|[a-z]+-[a-z0-9-]+: .{0,400}|test result.*" "stress/run-$i.txt" | head -5 || true
          done
          pkill -x yes || true
          echo "failed iterations: $fails" | tee stress/summary.txt
          [[ $fails -eq 0 ]]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x9-stress-${{ matrix.code }}-${{ matrix.shard }}
          path: |
            stress/
            tools/differential/runs/
          if-no-files-found: ignore
          retention-days: 5
