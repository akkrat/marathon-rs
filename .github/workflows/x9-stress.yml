name: TEMP x9 reader stress (workspace)

on:
  push:
    branches: ['wp/x9-ssh-output']

permissions:
  contents: read

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        code: [base, d19]
        shard: [1, 2, 3, 4]
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prerequisites
        run: |
          brew install rsync sshpass
          rustup toolchain install
      - name: Use main's reader (baseline)
        if: matrix.code == 'base'
        run: git checkout 3f0c8ccb -- crates/marathon-apple/src/extensions/reader.rs crates/marathon-apple/tests/reader.rs
      - name: Build tests
        run: cargo test --workspace --no-run -q
      - name: Repeat the workspace tests
        shell: bash
        run: |
          mkdir -p stress
          fails=0
          for i in 1 2 3 4; do
            if ! cargo test --workspace --no-fail-fast > "stress/run-$i.txt" 2>&1; then
              fails=$((fails+1))
            fi
            echo "== iteration $i"
            grep -E "^test .* FAILED$|panicked at|expectation |test result: FAILED" "stress/run-$i.txt" | cut -c1-400 || true
          done
          echo "failed iterations: $fails" | tee stress/summary.txt
          [[ $fails -eq 0 ]]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x9-stress-${{ matrix.code }}-${{ matrix.shard }}
          path: |
            stress/
            tools/differential/runs/
          if-no-files-found: ignore
          retention-days: 5
