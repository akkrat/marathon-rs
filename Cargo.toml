[workspace]
resolver = "3"
members = ["crates/*", "tools/fake-adb", "tools/fake-worker"]
# Phase 0 spikes are standalone, throwaway packages
exclude = ["spikes", "vendor/russh"]

[workspace.package]
edition = "2024"
license = "GPL-2.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[patch.crates-io]
russh = { path = "vendor/russh" }
