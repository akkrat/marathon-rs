# Two emulators for the first differential scenario (PLAN.md §6.4, WP 0.5 part B): the Kotlin marathon installs
# the fixture APKs on both and runs one batch of three tests, one passing, one failing and one ignored.
server:
  strict: true

devices:
  - serial: emulator-5554
    features: &features [shell_v2, cmd, stat_v2, ls_v2, abb_exec, sendrecv_v2]
    getprop: &getprop
      ro.build.version.sdk: 33
      ro.build.version.codename: REL
      ro.product.cpu.abi: arm64-v8a
      ro.product.model: Pixel 7
      ro.product.manufacturer: Google
      ro.boot.serialno: EMULATOR35X1X1X0
      net.hostname: localhost
      sys.boot_completed: 1
      ro.kernel.qemu: 1
  - serial: emulator-5556
    features: *features
    getprop: *getprop

shell:
  # `logcat -c` must come before the hanging logcat stream.
  - { exact: "logcat -c", stdout: "" }
  - { prefix: "logcat", stdout_file: ../../../adam/logcat-long.txt, hang: true }
  - { prefix: "am instrument", stdout_file: ../../../fake-adb/android-two-devices/script/instrumentation.txt, chunk_size: 256, chunk_interval_ms: 5 }
  - { prefix: "package install", service: abb_exec, stdout: "Success\n" }
  - { prefix: "cmd package install", service: exec, stdout: "Success\n" }
  - { regex: "^pm '?install'?", stdout: "Success\n" }
  - { exact: "pm list packages", stdout: "package:android\n" }
  - { exact: "echo $EXTERNAL_STORAGE", stdout: "/sdcard\n" }
  - { exact: "ls /system/bin/screenrecord", stdout: "/system/bin/screenrecord\n" }
  - { exact: "ls /system/bin/md5", stdout: "/system/bin/md5\n" }
  - { exact: "dumpsys input", stdout: "INPUT MANAGER STATE:\n  SurfaceOrientation: 0\n" }
  - { regex: "^rm ", stdout: "" }
  - { prefix: "mkdir ", stdout: "" }
  - { prefix: "pm clear", stdout: "Success\n" }
  - { prefix: "appops set", stdout: "" }
