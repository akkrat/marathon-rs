{
  "server": {
    "strict": true
  },
  "devices": [
    {
      "serial": "emulator-5554",
      "features": [
        "shell_v2",
        "cmd",
        "abb_exec",
        "sendrecv_v2"
      ],
      "getprop": {
        "sys.boot_completed": "1",
        "ro.product.cpu.abi": "x86",
        "ro.build.version.sdk": "33",
        "ro.build.version.codename": "REL",
        "ro.product.model": "Android SDK built for x86",
        "ro.product.manufacturer": "Google",
        "ro.boot.serialno": "EMULATOR30X6X5X0"
      }
    }
  ],
  "shell": [
    {
      "exact": "logcat -c",
      "stdout": ""
    },
    {
      "exact": "logcat -v long",
      "stdout_file": "../../../adam/logcat-long.txt",
      "hang": true
    },
    {
      "regex": "^am instrument.* -e log true",
      "stdout_file": "discovery.txt"
    },
    {
      "prefix": "am instrument",
      "stdout_file": "execution.txt"
    },
    {
      "prefix": "cmd package install",
      "service": "exec",
      "stdout": "Success\n"
    },
    {
      "exact": "pm list packages",
      "stdout": ""
    },
    {
      "exact": "echo $EXTERNAL_STORAGE",
      "stdout": "/sdcard\n"
    },
    {
      "exact": "ls /system/bin/screenrecord",
      "stdout": "/system/bin/screenrecord\n"
    },
    {
      "exact": "ls /system/bin/md5",
      "stdout": "/system/bin/md5\n"
    },
    {
      "exact": "dumpsys input",
      "stdout": "SurfaceOrientation: 0\n"
    },
    {
      "prefix": "rm ",
      "stdout": ""
    },
    {
      "prefix": "mkdir ",
      "stdout": ""
    },
    {
      "prefix": "package install",
      "service": "abb_exec",
      "stdout": "Success\n"
    }
  ]
}
