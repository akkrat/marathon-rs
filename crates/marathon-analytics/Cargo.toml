[package]
name = "marathon-analytics"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jcompat = { path = "../jcompat" }
marathon-core = { path = "../marathon-core" }
marathon-config = { path = "../marathon-config" }
tokio = { version = "=1.53.2", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
futures-util = "=0.3.34"
serde_json = "=1.0.154"
csv = "=1.4.0"
url = "=2.5.8"
base64 = "=0.22.1"
bytes = "=1.12.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.8.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "=0.27.7", default-features = false, features = ["http1", "ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
webpki-roots = "=1.0.11"
hyper-timeout = "=0.5.2"
tower-service = "=0.3.3"

[dev-dependencies]
marathon-core = { path = "../marathon-core", features = ["test-support"] }
