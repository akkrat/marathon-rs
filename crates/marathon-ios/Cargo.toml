[package]
name = "marathon-ios"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
marathon-logging = { path = "../marathon-logging" }
marathon-error = { path = "../marathon-error" }
jcompat = { path = "../jcompat" }
marathon-config = { path = "../marathon-config" }
marathon-core = { path = "../marathon-core" }
marathon-apple = { path = "../marathon-apple" }

tokio = { version = "=1.53.2", features = ["sync", "macros", "net", "io-util"] }
futures-util = "=0.3.34"
indexmap = "=2.14.2"

tempfile = "=3.27.0"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }

[dev-dependencies]
marathon-test-support = { path = "../marathon-test-support" }
tokio = { version = "=1.53.2", features = ["rt", "macros", "time", "test-util"] }
serde_json = "=1.0.154"
fake-worker = { path = "../../tools/fake-worker" }
