[package]
name = "marathon-test-support"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
marathon-logging = { path = "../marathon-logging" }
marathon-error = { path = "../marathon-error" }
jcompat = { path = "../jcompat" }
marathon-config = { path = "../marathon-config" }
marathon-core = { path = "../marathon-core", features = ["test-support"] }
marathon-apple = { path = "../marathon-apple", features = ["test-support"] }
fake-worker = { path = "../../tools/fake-worker" }
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "=1.53.2", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
anyhow = "1"
tempfile = "=3.27.0"

[dev-dependencies]
russh = "=0.64.1"
rand = "0.10"
