[package]
name = "marathon-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Seams the signal tests need (held-open exit watchdog, exit preparation);
# never enabled by the binary or the differential probe.
test-seams = []

[dependencies]
# The compatibility pass relies on clap introspection; re-run the full CLI matrix on any upgrade.
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
marathon-logging = { path = "../marathon-logging" }
tracing.workspace = true
tracing-subscriber.workspace = true
marathon-error = { path = "../marathon-error" }
jcompat = { path = "../jcompat" }
marathon-config = { path = "../marathon-config" }
marathon-core = { path = "../marathon-core" }
marathon-analytics = { path = "../marathon-analytics" }
marathon-ios = { path = "../marathon-ios" }
marathon-macos = { path = "../marathon-macos" }
marathon-android = { path = "../marathon-android" }
# Local time of day for the log layouts.
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
sha2 = "=0.10.9"

[dev-dependencies]
marathon-cli = { path = ".", features = ["test-seams"] }
base64 = "0.22"
futures-util = "=0.3.34"
fake-worker = { path = "../../tools/fake-worker" }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util", "sync"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip"] }
tempfile = "3"
nix = { version = "0.30", features = ["signal"] }
marathon-test-support = { path = "../marathon-test-support" }
marathon-adb = { path = "../marathon-adb", features = ["server"] }

[[bin]]
name = "marathon"
path = "src/main.rs"
