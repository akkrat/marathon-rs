[package]
name = "marathon-config"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jcompat = { path = "../jcompat" }
snakeyaml = { path = "../snakeyaml" }
# PLAN §4.2: only what java.util.zip.ZipFile reads (stored + deflated).
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip"] }
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }
sha2 = "=0.10.9"
tempfile = "3"
