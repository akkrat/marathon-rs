[package]
name = "marathon-config"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["serialize"] }
marathon-error = { path = "../marathon-error" }
jcompat = { path = "../jcompat" }
snakeyaml = { path = "../snakeyaml" }
# PLAN §4.2: only what java.util.zip.ZipFile reads (stored + deflated).
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
marathon-test-support = { path = "../marathon-test-support" }
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip"] }
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }
sha2 = "=0.10.9"
tempfile = "3"
