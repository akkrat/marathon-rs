[package]
name = "marathon-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
jcompat = { path = "../jcompat" }
marathon-config = { path = "../marathon-config" }
tokio = { version = "=1.53.2", features = ["rt", "rt-multi-thread", "time", "sync", "net", "signal", "macros"] }
futures-util = "=0.3.34"
crossbeam-queue = "=0.3.12"
crossbeam-skiplist = "=0.1.3"
rand = "=0.10.3"
indexmap = "=2.14.2"

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
image = { version = "=0.25.8", default-features = false }
gif = "=0.13.3"
nix = { version = "0.30", default-features = false }

[dev-dependencies]
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip"] }
image = { version = "=0.25.8", default-features = false, features = ["png"] }
marathon-core = { path = ".", features = ["test-support"] }
marathon-test-support = { path = "../marathon-test-support" }
tempfile = "3"
