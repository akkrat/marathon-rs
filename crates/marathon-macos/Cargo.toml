[package]
name = "marathon-macos"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jcompat = { path = "../jcompat" }
marathon-config = { path = "../marathon-config" }
marathon-core = { path = "../marathon-core" }
marathon-apple = { path = "../marathon-apple" }
tokio = { version = "=1.53.2", features = ["sync", "macros", "fs"] }
indexmap = "2"
futures-util = "0.3"

[dev-dependencies]
marathon-test-support = { path = "../marathon-test-support" }
marathon-apple = { path = "../marathon-apple", features = ["test-support"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "test-util", "time"] }
tempfile = "=3.27.0"
serde_json = "=1.0.154"
fake-worker = { path = "../../tools/fake-worker" }
